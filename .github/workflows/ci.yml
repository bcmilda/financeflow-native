name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  kontrola:
    name: Překlady, typy, testy, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Kontraktní test počítá stejná data kódem webu – web se stáhne vedle.
      # Když není dostupný (soukromé repo), test se sám přeskočí.
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: bcmilda/financeflow
          ref: dev
          path: web
      - run: npm ci
      - run: npm run kontrola
      - run: npm run typecheck
      - run: npm test
        env:
          WEB_REPO: ${{ github.workspace }}/web
          # Bez webu kontraktní test selže (nesmí se tiše přeskočit).
          KONTRAKT_POVINNY: '1'
      - run: npm run build

  android:
    name: Android APK
    needs: kontrola
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Build webové části a sync do Androidu
        working-directory: apps/mobile
        run: npm run android
      - name: Sestavit APK (debug)
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: financeflow-nativni-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      # APK ke stažení přímo do telefonu (bez přihlášení a bez zipu):
      # github.com/bcmilda/financeflow-native/releases/tag/prubezne
      - name: Zveřejnit APK (průběžná verze)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk financeflow-nativni.apk
          VERZE=$(node -p "require('./apps/mobile/package.json').version")
          POPIS="Průběžná ladicí verze n${VERZE} (commit ${GITHUB_SHA::7}). Instalace: stáhnout financeflow-nativni.apk v telefonu a otevřít (povolit instalaci z prohlížeče)."
          gh release view prubezne >/dev/null 2>&1 || gh release create prubezne --prerelease --title "Průběžná verze (ladicí)" --notes "$POPIS"
          gh release edit prubezne --title "Průběžná verze n${VERZE} (ladicí)" --notes "$POPIS"
          gh release upload prubezne financeflow-nativni.apk --clobber

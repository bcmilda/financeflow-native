name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  kontrola:
    name: Překlady, typy, testy, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run kontrola
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  android:
    name: Android APK
    needs: kontrola
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Build webové části a sync do Androidu
        working-directory: apps/mobile
        run: npm run android
      - name: Sestavit APK (debug)
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: financeflow-nativni-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
